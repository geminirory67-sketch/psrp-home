<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聊天室 · Palm State RolePlay</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; }
main.chatmain { flex: 1; min-height: 0; display: flex; }
main.chatmain > .wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; padding-block: 16px; max-width: 1360px; }
#gate:empty { display: none; }
.chat { flex: 1; min-height: 0; display: grid; grid-template-columns: 240px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.side { background: var(--night-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side h2 { margin: 0; padding: 14px 16px 8px; font-size: 12px; letter-spacing: .14em; color: var(--muted); }
.chlist { flex: 1 1 auto; min-height: 60px; overflow: auto; padding: 0 8px 8px; }
.chb { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; background: none; border: 0; color: var(--muted); font: inherit; font-size: 14.5px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.chb:hover { background: var(--panel-2); color: var(--ink); }
.chb[aria-current="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 3px 0 0 var(--gold); }
.chb .hash { color: var(--muted); opacity: .7; }
.chb .dot { margin-left: auto; min-width: 18px; height: 18px; border-radius: 9px; background: var(--sun); color: #1b1405; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.online { border-top: 1px solid var(--line); padding: 10px 16px 12px; font-size: 13px; color: var(--muted); max-height: 22%; overflow: auto; flex: none; }
.online b { color: var(--ink); }
.online ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; }
.online li::before { content: "● "; color: var(--ok); font-size: 10px; }
.panel { display: flex; flex-direction: column; min-height: 0; }
.ph { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.ph h1 { margin: 0; font-size: 18px; }
.ph p { margin: 0; color: var(--muted); font-size: 13.5px; }
.ph .live { margin-left: auto; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.ph .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.ph .live.on::before { background: var(--ok); }
.ph .mb { display: none; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 18px; display: flex; flex-direction: column; }
.older { align-self: center; margin-bottom: 10px; }
.day { align-self: center; font-size: 12px; color: var(--muted); background: var(--night-2); border-radius: 999px; padding: 2px 12px; margin: 10px 0; }
.m { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 12px; padding: 4px 6px; border-radius: 6px; position: relative; }
.m:hover { background: rgba(255,255,255,.03); }
.m.cont { padding-top: 0; }
.m.cont .av { visibility: hidden; height: 0; }
.m.cont .who { display: none; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; margin-top: 3px; }
.who { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.who b { font-size: 14.5px; }
.who time { font-size: 11.5px; color: var(--muted); }
.rb { font-size: 10.5px; padding: 0 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
.rb.admin { background: #4a3a12; color: var(--gold); } .rb.support { background: #1f3a2c; color: #7fe0b0; } .rb.police, .rb.police_cmd { background: #16284d; color: #8db4ff; }
.rb.fire, .rb.fire_cmd { background: #4a1c18; color: #ff9c8c; } .rb.ems, .rb.ems_cmd { background: #123a33; color: #6fe0c6; }
.txt { font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
.txt a { color: #8db4ff; }
.txt .men { background: rgba(232,184,90,.18); color: var(--gold); border-radius: 3px; padding: 0 2px; }
.m.me-mention { background: rgba(232,184,90,.07); box-shadow: inset 3px 0 0 var(--gold); }
.m.del .txt { color: var(--muted); font-style: italic; }
.m .x { position: absolute; right: 8px; top: 4px; display: none; background: var(--night-2); border: 1px solid var(--line); color: var(--muted); border-radius: 5px; font: inherit; font-size: 12px; padding: 1px 8px; cursor: pointer; }
.m:hover .x { display: block; }
.compose { border-top: 1px solid var(--line); padding: 12px 18px 14px; display: grid; gap: 6px; }
.compose .row { display: flex; gap: 8px; align-items: flex-end; }
.compose textarea { flex: 1; resize: none; min-height: 44px; max-height: 160px; font: inherit; font-size: 15px; color: var(--ink); background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
.compose textarea:focus { outline: none; border-color: var(--gold); }
.compose .hint { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.compose .err { color: var(--bad); }
.empty { margin: auto; text-align: center; color: var(--muted); }
.who .sx { font-size: 11.5px; color: #e8b85a; opacity: .85; }
.m.cont .who { display: none; }
.orig { background: none; border: 1px dashed #e0584a; color: #ff9a9a; border-radius: 5px; font: inherit; font-size: 12px; padding: 1px 8px; cursor: pointer; margin-top: 3px; }
.origtx { font-size: 13.5px; color: #ffb4a8; border-left: 3px solid #e0584a; padding: 2px 8px; margin-top: 3px; white-space: pre-wrap; }
.mgr { margin: 0 8px 8px; }
.vsec { border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; max-height: 46%; }
.vsec h2 { display: flex; align-items: center; justify-content: space-between; }
.vsec h2 button { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; width: 26px; height: 24px; font: inherit; font-size: 16px; line-height: 1; cursor: pointer; }
.vsec h2 button:hover { border-color: var(--gold); color: var(--gold); }
.vlist { overflow: auto; padding: 0 8px 8px; }
.vnone { margin: 2px 10px 6px; font-size: 12.5px; color: var(--muted); }
.vroom { border-radius: 8px; margin-bottom: 2px; }
.vroom.on { background: rgba(60,207,142,.07); box-shadow: inset 3px 0 0 var(--ok); }
.vhead { display: flex; align-items: center; }
.vhead .chb { flex: 1; min-width: 0; }
.vname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vcnt { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.vgear { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 5px; }
.vgear:hover { color: var(--gold); background: var(--panel-2); }
.vtag { font-size: 10.5px; color: var(--gold); margin: -4px 0 2px 36px; }
.vmem { list-style: none; margin: 0 0 4px; padding: 0 0 0 26px; display: grid; gap: 1px; }
.vmem li { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--muted); padding: 3px 6px; border-radius: 5px; position: relative; }
.vmem li.tap { cursor: pointer; } .vmem li.tap:hover { background: var(--panel-2); color: var(--ink); }
.vmem li.self .vmn { color: var(--ink); }
.vav { width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2); color: var(--ink); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; box-shadow: 0 0 0 2px transparent; transition: box-shadow .12s; }
.vmem li.spk .vav { box-shadow: 0 0 0 2px var(--ok); }
.vmn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vmic, .vown { font-size: 11px; }
.vpop { position: absolute; z-index: 30; left: 20px; top: 100%; background: var(--night); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; width: 210px; box-shadow: 0 10px 30px rgba(0,0,0,.45); color: var(--ink); cursor: default; }
.vpop label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.vpop input[type=range] { flex: 1; min-width: 0; accent-color: var(--gold); }
.vkick { background: none; border: 1px solid #e0584a; color: #ff8a7a; border-radius: 6px; font: inherit; font-size: 12.5px; padding: 3px 10px; cursor: pointer; }
.vbar { border-top: 1px solid var(--line); background: #0b1324; padding: 8px 10px; display: grid; gap: 6px; }
.vbar .vst { font-size: 12px; color: var(--ok); font-weight: 700; }
.vbar .vrn { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vbar .vbt { display: flex; gap: 4px; }
.vbar .vbt button { flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 5px 0; font: inherit; font-size: 15px; cursor: pointer; }
.vbar .vbt button[aria-pressed="true"] { background: #4a1c18; border-color: #e0584a; }
.vbar .vbt .vlv { background: #5a1d1a; border-color: #e0584a; font-size: 13px; }
.vind { background: rgba(60,207,142,.12); border: 1px solid rgba(60,207,142,.5); color: #7fe0b0; border-radius: 999px; font: inherit; font-size: 12.5px; padding: 3px 10px; cursor: pointer; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vbox { max-width: 480px !important; }
.vf { display: grid; gap: 5px; font-size: 13.5px; color: var(--muted); }
.vf input, .vf select { font: inherit; font-size: 15px; color: var(--ink); background: var(--night); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.vchk { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.vchk input { margin-top: 3px; accent-color: var(--gold); }
.vsub { margin: 8px 0 0; font-size: 14px; }
.vmrow { display: flex; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
.vdanger { color: #ff8a7a !important; border-color: #e0584a !important; }
.panel { position: relative; }
.vmusic { position: absolute; right: 16px; bottom: 96px; z-index: 15; width: 300px; max-width: calc(100% - 32px); max-height: calc(100% - 120px); overflow: auto; background: var(--night-2); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.5); padding: 10px 12px 12px; display: grid; gap: 8px; }
.vmusic[hidden] { display: none; }
.vm-hd { display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; }
.vm-hd button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; width: 28px; height: 22px; cursor: pointer; }
#vm-player-wrap { border-radius: 8px; overflow: hidden; background: #000; }
#vm-player-wrap[hidden] { display: none; }
#vm-player-wrap iframe { display: block; width: 100%; height: 200px; border: 0; }
.vm-now { display: grid; gap: 2px; min-width: 0; }
.vm-now b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vm-now span { font-size: 12px; color: var(--muted); }
.vm-ctl { display: flex; align-items: center; gap: 6px; }
.vm-ctl button { background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; width: 34px; height: 30px; cursor: pointer; font-size: 14px; }
.vm-ctl button:disabled { opacity: .35; cursor: default; }
#vm-time { white-space: nowrap; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vm-vol { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 13px; }
.vm-vol input { width: 76px; accent-color: var(--gold); }
.vm-add { display: flex; gap: 6px; }
.vm-add input { flex: 1; min-width: 0; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--night); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.vm-add .btn-primary { padding: 6px 12px; font-size: 13.5px; }
.vm-qh { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.vm-queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; max-height: 150px; overflow: auto; }
.vm-queue li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; font-size: 13px; background: var(--panel); border-radius: 6px; padding: 4px 6px 4px 8px; }
.vq-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vq-b { font-size: 11px; color: var(--muted); }
.vm-queue button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px; }
.vm-queue button:hover { color: #ff8a7a; }
.vbar .vbt #vbar-hq { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
.vbar .vbt #vbar-hq[aria-pressed="true"], .vbar .vbt #vbar-music[aria-pressed="true"] { background: #3d3212; border-color: var(--gold); color: var(--gold); }
.vpinrow { display: flex; gap: 8px; }
.vpinrow select { flex: 1; }
.vpinrow input { width: 110px; letter-spacing: .3em; text-align: center; }
.vpin { font: inherit; font-size: 28px; letter-spacing: .6em; text-align: center; color: var(--ink); background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; }
@media (max-width: 760px) { .vmusic { right: 8px; left: 8px; width: auto; max-width: none; bottom: 110px; } }
.vtoast { position: fixed; z-index: 200; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--night-2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 10px 16px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100vw - 32px); }
.vtoast.bad { border-color: #e0584a; }

.dlg { position: fixed; inset: 0; z-index: 100; background: rgba(5,8,20,.75); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg .box { background: var(--night-2); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 860px; max-height: 88vh; display: flex; flex-direction: column; }
.dlg header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.dlg header h3 { margin: 0; font-size: 18px; }
.dlg .bd { overflow: auto; padding: 14px 20px; display: grid; gap: 10px; }
.dlg .ft { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); }
.crow { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(160px, 1.6fr) 150px auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.crow input, .crow select { width: 100%; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--night); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.crow .ops { display: flex; gap: 4px; }
.crow .ops button { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; font: inherit; font-size: 12.5px; cursor: pointer; }
.crow .ops button.del { color: #ff8a7a; }
.crow .ops button:disabled { opacity: .3; cursor: default; }
.chead { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(160px, 1.6fr) 150px auto; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 10px; }
@media (max-width: 700px) { .crow, .chead { grid-template-columns: 1fr 1fr; } .chead { display: none; } }
@media (max-width: 760px) {
  main.chatmain > .wrap { padding: 0; }
  .chat { grid-template-columns: 1fr; border-radius: 0; border-left: 0; border-right: 0; }
  .side { display: none; position: absolute; z-index: 20; inset: 0 auto 0 0; width: 78%; max-width: 300px; box-shadow: 10px 0 30px rgba(0,0,0,.4); }
  .chat.open .side { display: flex; }
  .chat { position: relative; }
  .ph .mb { display: inline-block; }
  .ph p { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/logo.jpg" alt="" width="36" height="36"><b>Palm State</b></a>
    <nav class="navl" aria-label="主選單">
      <a href="/">首頁</a>
      <a href="/news/">公告</a>
      <a href="/forums/">論壇</a>
      <a href="/chat/" aria-current="page">聊天室</a>
      <a href="/safety/">公共安全</a>
      <a href="/rules/">規則</a>
      <a class="nav-cta" href="/whitelist/">白名單申請</a>
    </nav>
    <div class="account" id="account"></div>
  </div>
</header>

<main class="chatmain">
  <div class="wrap">
    <div id="gate"></div>
    <div class="chat" id="app" hidden>
      <aside class="side">
        <h2>頻道</h2>
        <div class="chlist" id="chlist"></div>
        <button type="button" class="btn-sec mgr" id="mgr" hidden>⚙ 管理頻道</button>
        <div class="vsec">
          <h2>語音頻道 <button type="button" id="vadd" title="建立語音頻道" aria-label="建立語音頻道">＋</button></h2>
          <div class="vlist" id="vlist"></div>
        </div>
        <div class="vbar" id="vbar" hidden>
          <div><div class="vst" id="vbar-state">語音已連線</div><div class="vrn" id="vbar-name"></div></div>
          <div class="vbt">
            <button type="button" id="vbar-mute" aria-pressed="false" title="靜音麥克風">🎙️</button>
            <button type="button" id="vbar-deaf" aria-pressed="false" title="關閉所有聲音">🎧</button>
            <button type="button" id="vbar-hq" aria-pressed="false" title="高音質模式">HQ</button>
            <button type="button" id="vbar-music" aria-pressed="false" title="YouTube 音樂">🎵</button>
            <button type="button" id="vbar-sfx" aria-pressed="false" title="加入／離開音效">🔔</button>
            <button type="button" id="vbar-leave" class="vlv" title="離開語音">離開</button>
          </div>
        </div>
        <div class="online" id="online"></div>
      </aside>
      <section class="panel">
        <div class="ph">
          <button type="button" class="mb" id="mb" aria-label="切換頻道">☰ 頻道</button>
          <div><h1 id="ch-title"># 綜合大廳</h1><p id="ch-desc"></p></div>
          <button type="button" class="vind" id="vind" hidden></button>
          <span class="live" id="live">連線中</span>
        </div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="vmusic" id="vmusic" hidden>
          <div class="vm-hd"><b>🎵 頻道音樂</b><button type="button" id="vm-close" title="收起">—</button></div>
          <div id="vm-player-wrap" hidden><div id="vm-player"></div></div>
          <div class="vm-now"><b id="vm-now">目前沒有播放音樂</b><span id="vm-by"></span></div>
          <div class="vm-ctl">
            <button type="button" id="vm-pp" title="暫停">⏸</button>
            <button type="button" id="vm-skip" title="下一首">⏭</button>
            <button type="button" id="vm-stop" title="停止並清空清單">⏹</button>
            <span id="vm-time"></span>
            <label class="vm-vol" title="音樂音量（只影響你自己）">🔉<input type="range" id="vm-vol" min="0" max="100" step="5" aria-label="音樂音量"></label>
          </div>
          <div class="vm-add"><input id="vm-url" placeholder="貼上 YouTube 連結" aria-label="YouTube 連結"><button type="button" class="btn-primary" id="vm-add">點歌</button></div>
          <div class="vm-qh" id="vm-qh">接下來（0）</div>
          <ol class="vm-queue" id="vm-queue"></ol>
        </div>
        <form class="compose" id="compose" novalidate>
          <div class="row">
            <textarea id="input" rows="1" maxlength="500" placeholder="輸入訊息，Enter 送出、Shift+Enter 換行" aria-label="訊息"></textarea>
            <button type="submit" class="btn-primary" id="send">送出</button>
          </div>
          <div class="hint"><span id="err" class="err" role="status"></span><span id="cnt">0 / 500</span></div>
        </form>
      </section>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/auth.js"></script>
<script src="/chat/voice.js"></script>
<script>
(function () {
  var el = PSRP.el, db = PSRP.client, me = null, staff = false, myName = "";
  var channels = [], cur = null, msgs = {}, unread = {}, lastId = 0, oldest = null, rt = null, live = false;
  var COLORS = ["#4a86ff", "#e8b85a", "#3ccf8e", "#ff8a3d", "#b98cff", "#ff5c6c", "#2fd0a6", "#5865f2"];
  var box = document.getElementById("msgs"), input = document.getElementById("input");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function color(name) { var h = 0; String(name).split("").forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return COLORS[h % COLORS.length]; }
  function hhmm(d) { var x = new Date(d); return String(x.getHours()).padStart(2, "0") + ":" + String(x.getMinutes()).padStart(2, "0"); }
  function dayKey(d) { var x = new Date(d); return x.getFullYear() + "/" + (x.getMonth() + 1) + "/" + x.getDate(); }
  function fmt(t) {
    var s = esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener nofollow">$1</a>');
    if (myName) { var re = new RegExp("@" + myName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g"); s = s.replace(re, '<span class="men">@' + esc(myName) + "</span>"); }
    return s;
  }
  function atBottom() { return box.scrollHeight - box.scrollTop - box.clientHeight < 80; }

  /* ---------- 頻道 ---------- */
  function renderChannels() {
    var l = document.getElementById("chlist"); l.innerHTML = "";
    channels.forEach(function (c) {
      var b = el("button", { type: "button", class: "chb", "aria-current": String(cur && c.slug === cur.slug) });
      b.appendChild(el("span", { class: "hash" }, c.view_role === "any" ? "#" : "🔒"));
      b.appendChild(el("span", null, c.title));
      if (unread[c.slug]) b.appendChild(el("span", { class: "dot" }, unread[c.slug] > 99 ? "99+" : String(unread[c.slug])));
      b.addEventListener("click", function () { open(c.slug); document.getElementById("app").classList.remove("open"); });
      l.appendChild(b);
    });
  }
  async function open(slug) {
    cur = channels.filter(function (c) { return c.slug === slug; })[0] || channels[0];
    try { localStorage.setItem("psrp-chat-ch", cur.slug); } catch (e) { /* 略過 */ }
    unread[cur.slug] = 0; renderChannels();
    document.getElementById("ch-title").textContent = (cur.view_role === "any" ? "# " : "🔒 ") + cur.title;
    document.getElementById("ch-desc").textContent = cur.description;
    input.placeholder = "傳訊息到 " + cur.title + "（Enter 送出、Shift+Enter 換行）";
    box.innerHTML = ""; box.appendChild(el("p", { class: "empty" }, "讀取中…"));
    msgs = {}; lastId = 0; oldest = null;
    var r = await db.from("chat_messages").select("*").eq("channel", cur.slug).order("id", { ascending: false }).limit(80);
    if (r.error) { box.innerHTML = ""; box.appendChild(el("p", { class: "empty" }, "讀取失敗：" + PSRP.errText(r.error))); return; }
    r.data.reverse().forEach(add);
    oldest = r.data.length ? r.data[0].id : null;
    render(true, r.data.length === 80);
    input.focus();
  }
  function add(m) { msgs[m.id] = m; if (m.id > lastId) lastId = m.id; if (staff && m.user_id && !(m.user_id in uinfo)) needInfo(m.user_id); }
  /* Staff：查詢發言者的 Email 與目前名稱 */
  var uinfo = {}, infoQ = [], infoT = null;
  function needInfo(id) {
    uinfo[id] = null; infoQ.push(id);
    clearTimeout(infoT);
    infoT = setTimeout(async function () {
      var ids = infoQ.splice(0); if (!ids.length) return;
      var r = await db.rpc("staff_user_info", { ids: ids });
      (r.data || []).forEach(function (x) { uinfo[x.id] = x; });
      render();
    }, 50);
  }

  /* ---------- 訊息 ---------- */
  function render(scroll, hasOlder) {
    var stick = scroll || atBottom();
    box.innerHTML = "";
    var list = Object.keys(msgs).map(Number).sort(function (a, b) { return a - b; }).map(function (k) { return msgs[k]; });
    if (hasOlder || (box._hasOlder && !scroll)) {
      box._hasOlder = true;
      var ob = el("button", { type: "button", class: "btn-sec older" }, "載入更早的訊息");
      ob.addEventListener("click", loadOlder); box.appendChild(ob);
    } else box._hasOlder = false;
    if (!list.length) box.appendChild(el("p", { class: "empty" }, "還沒有訊息，打聲招呼吧！"));
    var prev = null, lastDay = "";
    list.forEach(function (m) {
      var d = dayKey(m.created_at);
      if (d !== lastDay) { box.appendChild(el("div", { class: "day" }, d === dayKey(new Date()) ? "今天" : d)); lastDay = d; prev = null; }
      var cont = prev && prev.user_id === m.user_id && !prev.deleted && new Date(m.created_at) - new Date(prev.created_at) < 5 * 60e3;
      var mention = myName && m.user_id !== me.id && m.body.indexOf("@" + myName) !== -1;
      var row = el("div", { class: "m" + (cont ? " cont" : "") + (m.deleted ? " del" : "") + (mention ? " me-mention" : ""), "data-id": String(m.id) });
      var av = el("div", { class: "av", style: "background:" + color(m.author_name), "aria-hidden": "true" }, String(m.author_name || "?").trim().charAt(0).toUpperCase());
      row.appendChild(av);
      var right = el("div"), who = el("div", { class: "who" });
      who.appendChild(el("b", { style: "color:" + color(m.author_name) }, m.author_name));
      (m.author_roles || []).filter(function (r) { return r !== "member" && r !== "civ"; }).slice(0, 2).forEach(function (r) { who.appendChild(el("span", { class: "rb " + r }, PSRP.ROLE_NAMES[r] || r)); });
      who.appendChild(el("time", { datetime: m.created_at, title: new Date(m.created_at).toLocaleString("zh-TW") }, hhmm(m.created_at)));
      var ux = staff && uinfo[m.user_id];
      if (ux) who.appendChild(el("span", { class: "sx", title: "只有管理團隊看得到" }, "🛡️ " + ux.email + (ux.display_name && ux.display_name !== m.author_name ? "（目前名稱：" + ux.display_name + "）" : "")));
      right.appendChild(who);
      var t = el("div", { class: "txt", title: cont ? hhmm(m.created_at) : "" }); t.innerHTML = fmt(m.body); right.appendChild(t);
      if (staff && m.deleted) {
        var ob = el("button", { type: "button", class: "orig" }, "🛡️ 查看原文");
        ob.addEventListener("click", async function () {
          var r = await db.from("content_audit").select("old_body, actor_name").eq("kind", "chat").eq("ref_id", m.id).eq("action", "delete").order("id", { ascending: false }).limit(1);
          var x = (r.data || [])[0];
          ob.replaceWith(el("div", { class: "origtx" }, x ? "原文：" + x.old_body + "（由 " + (x.actor_name || "系統") + " 刪除）" : "找不到原文紀錄（在紀錄功能上線前就已刪除）。"));
        });
        right.appendChild(ob);
      }
      row.appendChild(right);
      if (!m.deleted && (m.user_id === me.id || staff)) {
        var x = el("button", { type: "button", class: "x", title: "刪除訊息" }, "刪除");
        x.addEventListener("click", async function () {
          if (!confirm("刪除這則訊息？")) return;
          var r = await db.rpc("chat_delete", { p_id: m.id }); if (r.error) return alert(PSRP.errText(r.error));
          m.deleted = true; m.body = "（訊息已刪除）"; render();
        });
        row.appendChild(x);
      }
      box.appendChild(row); prev = m;
    });
    if (stick) box.scrollTop = box.scrollHeight;
  }
  async function loadOlder() {
    if (!oldest) return;
    var h = box.scrollHeight;
    var r = await db.from("chat_messages").select("*").eq("channel", cur.slug).lt("id", oldest).order("id", { ascending: false }).limit(80);
    if (r.error) return;
    r.data.forEach(add); if (r.data.length) oldest = r.data[r.data.length - 1].id;
    box._hasOlder = r.data.length === 80;
    render(false, box._hasOlder);
    box.scrollTop = box.scrollHeight - h;
  }
  function onIncoming(m) {
    if (!m || !m.channel) return;
    if (cur && m.channel === cur.slug) { var isNew = !msgs[m.id]; add(m); render(m.user_id === me.id); if (isNew && document.hidden) document.title = "（新訊息）聊天室 · Palm State RolePlay"; }
    else if (m.user_id !== me.id && !m.deleted) { unread[m.channel] = (unread[m.channel] || 0) + 1; renderChannels(); }
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) document.title = "聊天室 · Palm State RolePlay"; });

  /* ---------- 即時連線（Realtime），失敗時改用輪詢 ---------- */
  function setLive(on) { live = on; var l = document.getElementById("live"); l.classList.toggle("on", on); l.textContent = on ? "即時連線" : "自動更新"; }
  function connect() {
    try {
      rt = db.channel("psrp-chat", { config: { presence: { key: me.id } } })
        .on("postgres_changes", { event: "*", schema: "public", table: "chat_messages" }, function (p) { onIncoming(p.new); })
        .on("presence", { event: "sync" }, function () { renderOnline(rt.presenceState()); })
        .subscribe(function (status) {
          if (status === "SUBSCRIBED") { setLive(true); rt.track({ name: myName, at: Date.now() }); }
          else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") setLive(false);
        });
    } catch (e) { setLive(false); }
  }
  function renderOnline(state) {
    var names = []; Object.keys(state || {}).forEach(function (k) { var s = state[k][0]; if (s && s.name && names.indexOf(s.name) === -1) names.push(s.name); });
    var o = document.getElementById("online"); o.innerHTML = "";
    o.appendChild(el("b", null, "線上 " + names.length + " 人"));
    var ul = el("ul"); names.slice(0, 50).forEach(function (n) { ul.appendChild(el("li", null, n)); }); o.appendChild(ul);
  }
  setInterval(async function () {
    if (!cur || document.hidden || live) return;
    var r = await db.from("chat_messages").select("*").eq("channel", cur.slug).gt("id", lastId).order("id").limit(100);
    (r.data || []).forEach(onIncoming);
  }, 4000);

  /* ---------- 送出 ---------- */
  function grow() { input.style.height = "auto"; input.style.height = Math.min(160, input.scrollHeight) + "px"; document.getElementById("cnt").textContent = input.value.length + " / 500"; }
  input.addEventListener("input", grow);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); document.getElementById("compose").requestSubmit(); } });
  document.getElementById("compose").addEventListener("submit", async function (e) {
    e.preventDefault();
    var v = input.value.trim(), err = document.getElementById("err"); err.textContent = "";
    if (!v || !cur) return;
    var btn = document.getElementById("send"); btn.disabled = true;
    var r = await db.rpc("chat_send", { p_channel: cur.slug, p_body: v });
    btn.disabled = false;
    if (r.error) { err.textContent = PSRP.errText(r.error); return; }
    input.value = ""; grow(); input.focus();
    if (!live) { var n = await db.from("chat_messages").select("*").eq("channel", cur.slug).gt("id", lastId).order("id"); (n.data || []).forEach(onIncoming); }
  });
  /* ---------- Staff：管理頻道 ---------- */
  var ROLES = [["any", "所有會員"], ["member", "白名單成員"], ["police", "LAPD 成員"], ["fire", "LAFD 成員"], ["ems", "EMS 成員"], ["staff", "管理團隊（Staff）"], ["admin", "僅最高管理"]];
  function manage() {
    var list = channels.map(function (c) { return { slug: c.slug, title: c.title, description: c.description, view_role: c.view_role, orig: true }; });
    var removed = [];
    var d = el("div", { class: "dlg", role: "dialog", "aria-modal": "true", "aria-label": "管理頻道" }), bx = el("div", { class: "box" });
    var hd = el("header"); hd.appendChild(el("h3", null, "管理聊天室頻道"));
    var x = el("button", { type: "button", class: "btn-sec" }, "關閉"); x.addEventListener("click", function () { d.remove(); }); hd.appendChild(x);
    var bd = el("div", { class: "bd" }), ft = el("div", { class: "ft" });
    function draw() {
      bd.innerHTML = "";
      bd.appendChild(el("p", { class: "note", style: "margin:0" }, "修改頻道名稱、說明、誰看得到，並調整順序。刪除頻道會一併刪除裡面所有訊息。"));
      var h = el("div", { class: "chead" }); ["頻道名稱", "說明", "誰可以看與發言", ""].forEach(function (t) { h.appendChild(el("span", null, t)); }); bd.appendChild(h);
      list.forEach(function (c, i) {
        var r = el("div", { class: "crow" });
        var t = el("input", { maxlength: "30", placeholder: "頻道名稱", "aria-label": "頻道名稱" }); t.value = c.title; t.addEventListener("input", function () { c.title = t.value; });
        var ds = el("input", { maxlength: "80", placeholder: "說明（可留空）", "aria-label": "說明" }); ds.value = c.description; ds.addEventListener("input", function () { c.description = ds.value; });
        var rl = el("select", { "aria-label": "權限" }); ROLES.forEach(function (o) { rl.appendChild(el("option", { value: o[0] }, o[1])); }); rl.value = c.view_role; rl.addEventListener("change", function () { c.view_role = rl.value; });
        var ops = el("div", { class: "ops" });
        var up = el("button", { type: "button", title: "上移" }, "↑"), dn = el("button", { type: "button", title: "下移" }, "↓"), del = el("button", { type: "button", class: "del" }, "刪除");
        up.disabled = i === 0; dn.disabled = i === list.length - 1;
        up.addEventListener("click", function () { list.splice(i - 1, 0, list.splice(i, 1)[0]); draw(); });
        dn.addEventListener("click", function () { list.splice(i + 1, 0, list.splice(i, 1)[0]); draw(); });
        del.addEventListener("click", function () { if (c.orig && !confirm("刪除「" + c.title + "」？裡面的所有訊息都會一起刪除，無法復原。")) return; if (c.orig) removed.push(c.slug); list.splice(i, 1); draw(); });
        ops.appendChild(up); ops.appendChild(dn); ops.appendChild(del);
        r.appendChild(t); r.appendChild(ds); r.appendChild(rl); r.appendChild(ops); bd.appendChild(r);
      });
    }
    var add = el("button", { type: "button", class: "btn-sec" }, "＋ 新增頻道");
    add.addEventListener("click", function () { list.push({ slug: "c" + Date.now().toString(36), title: "", description: "", view_role: "any", orig: false }); draw(); var ins = bd.querySelectorAll(".crow input"); ins[ins.length - 2].focus(); });
    var msg = el("span", { class: "form-msg", role: "status" });
    var save = el("button", { type: "button", class: "btn-primary" }, "儲存");
    save.addEventListener("click", async function () {
      msg.className = "form-msg";
      if (list.some(function (c) { return !c.title.trim(); })) { msg.className = "form-msg err"; msg.textContent = "每個頻道都要有名稱。"; return; }
      if (!list.length) { msg.className = "form-msg err"; msg.textContent = "至少要保留一個頻道。"; return; }
      save.disabled = true; msg.textContent = "儲存中…";
      try {
        for (var i = 0; i < removed.length; i++) { var r1 = await db.from("chat_channels").delete().eq("slug", removed[i]); if (r1.error) throw r1.error; }
        var rows = list.map(function (c, i) { return { slug: c.slug, title: c.title.trim(), description: c.description.trim(), view_role: c.view_role, sort: (i + 1) * 10 }; });
        var r2 = await db.from("chat_channels").upsert(rows); if (r2.error) throw r2.error;
        var r3 = await db.from("chat_channels").select("*").order("sort"); channels = r3.data || channels;
        d.remove();
        var still = channels.some(function (c) { return cur && c.slug === cur.slug; });
        if (still) { cur = channels.filter(function (c) { return c.slug === cur.slug; })[0]; renderChannels(); document.getElementById("ch-title").textContent = (cur.view_role === "any" ? "# " : "🔒 ") + cur.title; document.getElementById("ch-desc").textContent = cur.description; }
        else open(channels[0].slug);
      } catch (err) { save.disabled = false; msg.className = "form-msg err"; msg.textContent = PSRP.errText(err); }
    });
    var left = el("div"); left.appendChild(add); ft.appendChild(left);
    var right = el("div", { style: "display:flex;gap:10px;align-items:center" }); right.appendChild(msg); right.appendChild(save); ft.appendChild(right);
    draw(); bx.appendChild(hd); bx.appendChild(bd); bx.appendChild(ft); d.appendChild(bx); document.body.appendChild(d);
  }
  document.getElementById("mgr").addEventListener("click", manage);
  document.getElementById("mb").addEventListener("click", function () { document.getElementById("app").classList.toggle("open"); });

  async function start() {
    PSRP.mountAccountChip(document.getElementById("account"));
    var gate = document.getElementById("gate");
    if (!db) { gate.appendChild(el("div", { class: "notice warn" }, "聊天室暫時無法使用。")); return; }
    me = await PSRP.profile();
    if (!me) { gate.style.paddingTop = "20px"; PSRP.mountAuthForm(gate, function () { location.reload(); }, "聊天室僅限網站會員使用，請先登入或註冊帳號。"); return; }
    staff = PSRP.hasRole(me, "admin") || PSRP.hasRole(me, "support");
    myName = me.display_name || "";
    var r = await db.from("chat_channels").select("*").order("sort");
    if (r.error || !r.data.length) { gate.appendChild(el("div", { class: "notice warn" }, "聊天室尚未開放。")); return; }
    channels = r.data;
    document.getElementById("app").hidden = false;
    document.getElementById("mgr").hidden = !staff;
    var saved = null; try { saved = localStorage.getItem("psrp-chat-ch"); } catch (e) { /* 略過 */ }
    var want = location.hash.replace("#", "") || saved;
    await open(channels.some(function (c) { return c.slug === want; }) ? want : channels[0].slug);
    connect();
    if (window.PSRPVoice) window.PSRPVoice.init({ db: db, me: me, staff: staff, el: el, name: myName });
  }
  start();
})();
</script>
</body>
</html>
