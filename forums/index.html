<style>
.fhead { background: linear-gradient(180deg, #151b36, #0d1124); border-bottom: 1px solid var(--line); }
.fhead .wrap { padding-block: 34px 26px; display: flex; gap: 16px; align-items: end; justify-content: space-between; flex-wrap: wrap; }
.fhead .k { font-family: var(--font-display); letter-spacing: .28em; font-size: 13px; color: var(--sun); font-weight: 600; }
.fhead h1 { margin: 4px 0 0; font-family: var(--font-zh-display); font-weight: 900; font-size: clamp(28px, 4vw, 40px); }

.fstats { display: flex; gap: 22px; font-size: 13px; color: var(--muted); }
.fstats b { display: block; color: var(--ink); font-family: var(--font-display); font-size: 22px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); margin: 0 0 14px; }
.crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--ink); }
.crumbs span.sep { opacity: .5; }

.grp > h2 { margin: 0; padding: 11px 18px; font-size: 14px; letter-spacing: .12em; background: var(--panel-2); border-bottom: 1px solid var(--line); color: var(--gold); font-family: var(--font-display); text-transform: uppercase; }
.cat { display: grid; grid-template-columns: 52px minmax(0, 1fr) 150px 260px; gap: 16px; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.cat:last-child { border-bottom: 0; }
.cat:hover { background: rgba(255,255,255,.025); }
.cat .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; background: var(--night-2); border: 1px solid var(--line); }
.cat h3 { margin: 0; font-size: 16.5px; }
.cat p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.cat .lock { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-left: 6px; }
.cat .st { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.cat .st b { color: var(--ink); font-weight: 500; }
.cat .last { font-size: 13px; color: var(--muted); min-width: 0; }
.cat .last a { color: var(--ink); text-decoration: none; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat .last a:hover { text-decoration: underline; }
.bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
.bar h2 { margin: 0; font-family: var(--font-zh-display); font-size: 26px; }
.bar p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.tlist { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.th { display: grid; grid-template-columns: minmax(0, 1fr) 110px 220px; gap: 14px; padding: 9px 18px; background: var(--panel-2); font-size: 12px; letter-spacing: .1em; color: var(--muted); }
.tr { display: grid; grid-template-columns: minmax(0, 1fr) 110px 220px; gap: 14px; align-items: center; padding: 13px 18px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.tr:hover { background: rgba(255,255,255,.025); }
.tr .t { min-width: 0; }

.tr .t small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.tag { display: inline-block; font-size: 11.5px; border-radius: 4px; padding: 0 6px; margin-right: 6px; vertical-align: 2px; }
.tag.pin { background: #4a3a12; color: var(--gold); } .tag.lock { background: var(--panel-2); color: var(--muted); } .tag.del { background: #4a1c22; color: #ff9a9a; }
.tr .n { font-size: 13px; color: var(--muted); text-align: center; } .tr .n b { display: block; color: var(--ink); font-weight: 500; font-size: 14px; }
.tr .l { font-size: 13px; color: var(--muted); }

.pager { display: flex; gap: 6px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }

.pager span.cur { background: var(--gold); color: #1b1405; border-color: var(--gold); font-weight: 700; }
.post { display: grid; grid-template-columns: 190px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); margin-bottom: 12px; }
.post .au { background: var(--night-2); border-right: 1px solid var(--line); padding: 18px 14px; text-align: center; display: grid; gap: 6px; align-content: start; justify-items: center; }
.av { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 26px; color: #fff; }

.au .rs { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }

.rb.admin { background: #4a3a12; color: var(--gold); } .rb.support { background: #1f3a2c; color: #7fe0b0; } .rb.police, .rb.police_cmd { background: #16284d; color: #8db4ff; }
.rb.fire, .rb.fire_cmd { background: #4a1c18; color: #ff9c8c; } .rb.ems, .rb.ems_cmd { background: #123a33; color: #6fe0c6; }
.au small { color: var(--muted); font-size: 12px; line-height: 1.6; }
.post .bd { padding: 14px 20px 16px; min-width: 0; display: grid; grid-template-rows: auto 1fr auto; }
.post .meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; }
.post .meta a { color: var(--muted); text-decoration: none; }
.post .acts { display: flex; gap: 6px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
.post .acts button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 5px; padding: 2px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.post .acts button:hover { color: var(--ink); border-color: var(--gold); }
.post.deleted .content { color: var(--muted); font-style: italic; }
.content { font-size: 15px; line-height: 1.8; word-wrap: break-word; overflow-wrap: anywhere; }
.content p { margin: 0 0 10px; } .content p:last-child { margin-bottom: 0; }
.content h3, .content h4 { margin: 14px 0 6px; }
.content blockquote { margin: 8px 0; padding: 8px 14px; border-left: 3px solid var(--gold); background: var(--night-2); border-radius: 4px; color: #cfd4e6; }
.content code { background: var(--night-2); padding: 1px 5px; border-radius: 4px; font-size: 13.5px; }
.content pre { background: var(--night); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
.content pre code { background: none; padding: 0; }
.content img { max-width: 100%; max-height: 520px; border-radius: 6px; display: block; margin: 6px 0; }
.content a { color: #8db4ff; }
.content ul, .content ol { margin: 4px 0 10px; padding-left: 22px; }
.editor { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 14px; display: grid; gap: 10px; }
.editor .tb { display: flex; gap: 6px; flex-wrap: wrap; }
.editor .tb button { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 3px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.editor textarea, .editor input[type=text] { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--night); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.editor textarea { min-height: 170px; resize: vertical; line-height: 1.7; }
.editor .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.editor .pv { border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; }
.modbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: #2a2210; border: 1px solid #5a4818; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; color: var(--gold); }
.modbar button, .modbar select { background: var(--night-2); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }
.side-note { font-size: 13px; color: var(--muted); }
@media (max-width: 900px) {
  .cat { grid-template-columns: 44px minmax(0, 1fr); }
  .cat .st, .cat .last { grid-column: 2; }
  .cat .st { display: flex; gap: 12px; }
  .th { display: none; }
  .tr { grid-template-columns: minmax(0, 1fr) auto; }
  .tr .l { grid-column: 1 / -1; }
  .post { grid-template-columns: 1fr; }
  .post .au { border-right: 0; border-bottom: 1px solid var(--line); grid-template-columns: auto 1fr; justify-items: start; text-align: left; align-items: center; gap: 2px 12px; padding: 12px 14px; }
  .post .au .av { width: 42px; height: 42px; font-size: 18px; grid-row: span 3; }
  .post .au .rs { justify-content: flex-start; }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
(function () {
  var el = PSRP.el, db = PSRP.client, me = null, staff = false, cats = [], view = document.getElementById("view");
  var TPP = 25, PPP = 20;
  var COLORS = ["#4a86ff", "#e8b85a", "#3ccf8e", "#ff8a3d", "#b98cff", "#ff5c6c", "#2fd0a6", "#5865f2"];

  /* ---------- 工具 ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function ago(d) {
    var s = (Date.now() - new Date(d).getTime()) / 1000;
    if (s < 60) return "剛剛"; if (s < 3600) return Math.floor(s / 60) + " 分鐘前"; if (s < 86400) return Math.floor(s / 3600) + " 小時前";
    if (s < 86400 * 7) return Math.floor(s / 86400) + " 天前";
    var x = new Date(d); return x.getFullYear() + "/" + (x.getMonth() + 1) + "/" + x.getDate();
  }
  function fullTime(d) { return new Date(d).toLocaleString("zh-TW"); }
  function color(name) { var h = 0; String(name).split("").forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return COLORS[h % COLORS.length]; }
  function avatar(name) { var a = el("div", { class: "av", style: "background:" + color(name) }, String(name || "?").trim().charAt(0).toUpperCase()); return a; }
  /* 安全的簡易 Markdown：先跳脫 HTML，再套用格式 */
  function md(src) {
    var blocks = [], s = String(src || "").replace(/\r/g, "");
    s = s.replace(/```([\s\S]*?)```/g, function (_, c) { blocks.push("<pre><code>" + esc(c.replace(/^\n/, "")) + "</code></pre>"); return "\u0000" + (blocks.length - 1) + "\u0000"; });
    var lines = esc(s).split("\n"), out = [], para = [], list = null, quote = [];
    function inl(t) {
      return t.replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/!\[([^\]]*)\]\((https:\/\/[^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
        .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/)[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener nofollow">$1</a>')
        .replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener nofollow">$2</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*\s][^*]*)\*/g, "<i>$1</i>").replace(/~~([^~]+)~~/g, "<s>$1</s>");
    }
    function flush() {
      if (para.length) { out.push("<p>" + para.map(inl).join("<br>") + "</p>"); para = []; }
      if (list) { out.push("<" + list.t + ">" + list.items.map(function (i) { return "<li>" + inl(i) + "</li>"; }).join("") + "</" + list.t + ">"); list = null; }
      if (quote.length) { out.push("<blockquote>" + md(quote.join("\n").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&")) + "</blockquote>"); quote = []; }
    }
    lines.forEach(function (l) {
      var m;
      if (/^\u0000\d+\u0000$/.test(l.trim())) { flush(); out.push(l.trim()); return; }
      if ((m = l.match(/^&gt;\s?(.*)$/))) { if (para.length || list) { var q = quote; quote = []; flush(); quote = q; } quote.push(m[1]); return; }
      if (quote.length) flush();
      if (!l.trim()) { flush(); return; }
      if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { flush(); out.push("<h" + (m[1].length + 2) + ">" + inl(m[2]) + "</h" + (m[1].length + 2) + ">"); return; }
      if ((m = l.match(/^\s*[-*]\s+(.*)$/))) { if (para.length) flush(); if (!list || list.t !== "ul") { flush(); list = { t: "ul", items: [] }; } list.items.push(m[1]); return; }
      if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { if (para.length) flush(); if (!list || list.t !== "ol") { flush(); list = { t: "ol", items: [] }; } list.items.push(m[1]); return; }
      if (list) flush();
      para.push(l);
    });
    flush();
    return out.join("").replace(/\u0000(\d+)\u0000/g, function (_, i) { return blocks[+i]; });
  }
  function crumbs(items) {
    var c = el("nav", { class: "crumbs", "aria-label": "位置" });
    items.forEach(function (it, i) {
      if (i) c.appendChild(el("span", { class: "sep" }, "›"));
      c.appendChild(it[1] ? el("a", { href: it[1] }, it[0]) : el("span", null, it[0]));
    });
    return c;
  }
  function pager(total, per, page, base) {
    var n = Math.ceil(total / per); if (n <= 1) return el("span");
    var p = el("nav", { class: "pager", "aria-label": "分頁" });
    for (var i = 1; i <= n; i++) {
      if (n > 9 && i > 2 && i < n - 1 && Math.abs(i - page) > 2) { if (!p.lastChild || p.lastChild.textContent !== "…") p.appendChild(el("span", null, "…")); continue; }
      p.appendChild(i === page ? el("span", { class: "cur" }, String(i)) : el("a", { href: base + "/" + i }, String(i)));
    }
    return p;
  }
  function canPost(c) { if (!me) return false; if (staff) return true; return c.post_role === "any" || PSRP.hasRole(me, c.post_role); }
  function errBox(t) { view.innerHTML = ""; view.appendChild(el("div", { class: "notice warn" }, t)); }
  function loginHint(text) {
    var d = el("div", { class: "notice", style: "display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap" });
    d.appendChild(el("span", null, text)); d.appendChild(el("a", { class: "chip-login", href: "/apply/?next=" + encodeURIComponent("/forums/" + location.hash) }, "登入／註冊"));
    return d;
  }

  /* ---------- 首頁：版面列表 ---------- */
  async function showIndex() {
    document.title = "論壇 · Palm State RolePlay";
    var r = await db.rpc("forum_index");
    if (r.error) return errBox("論壇暫時無法讀取：" + PSRP.errText(r.error));
    cats = r.data;
    var tt = 0, tp = 0; cats.forEach(function (c) { tt += Number(c.threads); tp += Number(c.posts); });
    var fs = document.getElementById("fstats"); fs.innerHTML = "";
    [["主題", tt], ["文章", tp], ["版面", cats.length]].forEach(function (x) { var d = el("div"); d.appendChild(el("b", null, String(x[1]))); d.appendChild(document.createTextNode(x[0])); fs.appendChild(d); });
    view.innerHTML = "";
    if (!me) view.appendChild(loginHint("登入帳號後就可以發文與回覆；部門成員登入後還能看到部門內部討論區。"));
    var groups = [];
    cats.forEach(function (c) { var g = groups.filter(function (x) { return x.name === c.grp; })[0]; if (!g) groups.push(g = { name: c.grp, list: [] }); g.list.push(c); });
    groups.forEach(function (g) {
      var box = el("section", { class: "grp" }); box.appendChild(el("h2", null, g.name));
      g.list.forEach(function (c) {
        var a = el("a", { class: "cat", href: "#c/" + c.slug });
        a.appendChild(el("div", { class: "ic", "aria-hidden": "true" }, c.icon));
        var t = el("div"), h = el("h3", null, c.title);
        if (c.post_role !== "any") h.appendChild(el("span", { class: "lock" }, c.post_role === "admin" ? "僅管理團隊發文" : "成員限定"));
        t.appendChild(h); t.appendChild(el("p", null, c.description)); a.appendChild(t);
        var st = el("div", { class: "st" });
        var s1 = el("span"); s1.appendChild(el("b", null, String(c.threads))); s1.appendChild(document.createTextNode(" 主題")); st.appendChild(s1);
        var s2 = el("span"); s2.appendChild(el("b", null, String(c.posts))); s2.appendChild(document.createTextNode(" 文章")); st.appendChild(s2);
        a.appendChild(st);
        var l = el("div", { class: "last" });
        if (c.last_thread_id) {
          var lt = el("a", { href: "#t/" + c.last_thread_id }, c.last_title);
          lt.addEventListener("click", function (e) { e.stopPropagation(); });
          l.appendChild(lt); l.appendChild(el("span", null, c.last_name + " · " + ago(c.last_at)));
        } else l.textContent = "還沒有文章";
        a.appendChild(l);
        box.appendChild(a);
      });
      view.appendChild(box);
    });
  }

  /* ---------- 版面：主題列表 ---------- */
  async function catBySlug(slug) {
    if (!cats.length) { var r = await db.rpc("forum_index"); cats = r.data || []; }
    return cats.filter(function (c) { return c.slug === slug; })[0];
  }
  async function showCategory(slug, page) {
    var c = await catBySlug(slug);
    if (!c) return errBox("找不到這個版面，或你沒有查看權限。");
    document.title = c.title + " · 論壇";
    var from = (page - 1) * TPP;
    var r = await db.from("forum_threads").select("*", { count: "exact" }).eq("category_id", c.id).order("pinned", { ascending: false }).order("last_post_at", { ascending: false }).range(from, from + TPP - 1);
    if (r.error) return errBox(PSRP.errText(r.error));
    view.innerHTML = "";
    view.appendChild(crumbs([["論壇", "#"], [c.title]]));
    var bar = el("div", { class: "bar" }), t = el("div");
    t.appendChild(el("h2", null, c.icon + " " + c.title)); t.appendChild(el("p", null, c.description));
    bar.appendChild(t);
    if (canPost(c)) bar.appendChild(el("a", { class: "btn-primary", href: "#new/" + c.slug, style: "text-decoration:none" }, "＋ 發表新主題"));
    else if (!me) bar.appendChild(el("a", { class: "btn-sec", href: "/apply/?next=" + encodeURIComponent("/forums/#c/" + slug), style: "text-decoration:none" }, "登入後發文"));
    view.appendChild(bar);
    var list = el("div", { class: "tlist" });
    var th = el("div", { class: "th" }); ["主題", "回覆／瀏覽", "最新回覆"].forEach(function (x) { th.appendChild(el("span", null, x)); }); list.appendChild(th);
    if (!r.data.length) list.appendChild(el("div", { class: "empty" }, "這個版面還沒有主題。" + (canPost(c) ? "來發第一篇吧！" : "")));
    r.data.forEach(function (x) {
      var a = el("a", { class: "tr", href: "#t/" + x.id }), t2 = el("div", { class: "t" });
      if (x.deleted) t2.appendChild(el("span", { class: "tag del" }, "已刪除"));
      if (x.pinned) t2.appendChild(el("span", { class: "tag pin" }, "置頂"));
      if (x.locked) t2.appendChild(el("span", { class: "tag lock" }, "🔒 鎖定"));
      t2.appendChild(el("b", null, x.title));
      t2.appendChild(el("small", null, x.author_name + " · " + ago(x.created_at)));
      a.appendChild(t2);
      var n = el("div", { class: "n" }); n.appendChild(el("b", null, String(x.reply_count))); n.appendChild(document.createTextNode(x.views + " 瀏覽")); a.appendChild(n);
      var l = el("div", { class: "l" }); l.appendChild(el("b", null, x.last_post_name)); l.appendChild(document.createTextNode(" · " + ago(x.last_post_at))); a.appendChild(l);
      list.appendChild(a);
    });
    view.appendChild(list);
    view.appendChild(pager(r.count || 0, TPP, page, "#c/" + slug));
  }

  /* ---------- 文章 ---------- */
  async function showThread(id, page) {
    var tr = await db.from("forum_threads").select("*").eq("id", id).maybeSingle();
    if (tr.error || !tr.data) return errBox("找不到這篇文章，可能已被刪除或你沒有查看權限。");
    var t = tr.data;
    if (!cats.length) { var ci = await db.rpc("forum_index"); cats = ci.data || []; }
    var c = cats.filter(function (x) { return x.id === t.category_id; })[0] || { title: "版面", slug: "" };
    document.title = t.title + " · 論壇";
    try { var k = "fv" + id; if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, "1"); db.rpc("forum_view", { p_thread: id }).then(function () {}); } } catch (e) { /* 略過 */ }
    var total = t.reply_count + 1, pages = Math.max(1, Math.ceil(total / PPP));
    if (page === -1) page = pages;
    var from = (page - 1) * PPP;
    var pr = await db.from("forum_posts").select("*").eq("thread_id", id).order("id").range(from, from + PPP - 1);
    if (pr.error) return errBox(PSRP.errText(pr.error));
    var ids = pr.data.map(function (p) { return p.author_id; }).filter(Boolean), info = {};
    if (ids.length) { var ai = await db.rpc("forum_authors", { ids: ids }); (ai.data || []).forEach(function (x) { info[x.id] = x; }); }
    view.innerHTML = "";
    view.appendChild(crumbs([["論壇", "#"], [c.title, "#c/" + c.slug], [t.title]]));
    var bar = el("div", { class: "bar" }), h = el("div"), h2 = el("h2");
    if (t.pinned) h2.appendChild(el("span", { class: "tag pin" }, "置頂"));
    if (t.locked) h2.appendChild(el("span", { class: "tag lock" }, "🔒 鎖定"));
    if (t.deleted) h2.appendChild(el("span", { class: "tag del" }, "已刪除"));
    h2.appendChild(document.createTextNode(t.title)); h.appendChild(h2);
    h.appendChild(el("p", null, t.author_name + " 發表於 " + fullTime(t.created_at) + " · " + t.reply_count + " 則回覆 · " + t.views + " 次瀏覽"));
    bar.appendChild(h); view.appendChild(bar);
    if (staff) view.appendChild(modBar(t));
    view.appendChild(pager(total, PPP, page, "#t/" + id));
    pr.data.forEach(function (p, i) { view.appendChild(postCard(p, info[p.author_id], from + i + 1, t)); });
    view.appendChild(pager(total, PPP, page, "#t/" + id));
    // 回覆
    if (!me) view.appendChild(loginHint("登入後就可以回覆這篇文章。"));
    else if (t.deleted) { /* 不顯示 */ }
    else if (t.locked && !staff) view.appendChild(el("div", { class: "notice" }, "🔒 這篇文章已鎖定，無法回覆。"));
    else view.appendChild(editorBox({ title: false, submit: "送出回覆", onSubmit: async function (v) {
      var r = await db.rpc("forum_reply", { p_thread: id, p_body: v.body });
      if (r.error) throw r.error;
      location.hash = "#t/" + id + "/last"; if (location.hash === "#t/" + id + "/last") route();
    } }));
  }
  function postCard(p, inf, no, t) {
    var card = el("article", { class: "post" + (p.deleted ? " deleted" : ""), id: "p" + p.id });
    var au = el("div", { class: "au" });
    au.appendChild(avatar(p.author_name));
    au.appendChild(el("b", null, p.author_name || "已刪除的帳號"));
    var rs = el("div", { class: "rs" }), roles = (inf && inf.roles) || p.author_roles || [];
    roles.filter(function (r) { return r !== "member" && r !== "civ"; }).slice(0, 3).forEach(function (r) { rs.appendChild(el("span", { class: "rb " + r }, PSRP.ROLE_NAMES[r] || r)); });
    if (!rs.children.length) rs.appendChild(el("span", { class: "rb" }, roles.indexOf("member") !== -1 ? "成員" : "玩家"));
    au.appendChild(rs);
    if (inf) au.appendChild(el("small", null, inf.posts + " 篇文章 · " + new Date(inf.joined).getFullYear() + "/" + (new Date(inf.joined).getMonth() + 1) + " 加入"));
    card.appendChild(au);
    var bd = el("div", { class: "bd" }), meta = el("div", { class: "meta" });
    meta.appendChild(el("span", { title: fullTime(p.created_at) }, ago(p.created_at) + (p.edited_at ? " · 已編輯" : "")));
    meta.appendChild(el("a", { href: "#t/" + p.thread_id + "/p" + p.id, title: "這篇的連結" }, "#" + no));
    bd.appendChild(meta);
    var content = el("div", { class: "content" }); content.innerHTML = md(p.body); bd.appendChild(content);
    var acts = el("div", { class: "acts" });
    if (me && !p.deleted && !t.deleted && (!t.locked || staff)) {
      var q = el("button", { type: "button" }, "引用");
      q.addEventListener("click", function () {
        var ta = document.querySelector(".editor textarea"); if (!ta) return;
        var quoted = "> **" + p.author_name + " 寫道：**\n" + p.body.split("\n").filter(function (l) { return !/^>/.test(l); }).slice(0, 8).map(function (l) { return "> " + l; }).join("\n") + "\n\n";
        ta.value += (ta.value && !/\n$/.test(ta.value) ? "\n" : "") + quoted; ta.focus(); ta.scrollIntoView({ block: "center" });
      });
      acts.appendChild(q);
    }
    if (me && !p.deleted && (p.author_id === me.id || staff)) {
      var ed = el("button", { type: "button" }, "編輯");
      ed.addEventListener("click", function () {
        var box = editorBox({ title: false, submit: "儲存修改", body: p.body, cancel: function () { box.replaceWith(content); acts.hidden = false; }, onSubmit: async function (v) {
          var r = await db.rpc("forum_edit_post", { p_post: p.id, p_body: v.body }); if (r.error) throw r.error; route();
        } });
        content.replaceWith(box); acts.hidden = true;
      });
      var del = el("button", { type: "button" }, no === 1 ? "刪除主題" : "刪除");
      del.addEventListener("click", async function () {
        if (!confirm(no === 1 ? "刪除第一篇會把整個主題刪除，確定？" : "確定刪除這則回覆？")) return;
        var r = await db.rpc("forum_delete_post", { p_post: p.id }); if (r.error) return alert(PSRP.errText(r.error));
        if (no === 1) location.hash = "#c/" + (cats.filter(function (x) { return x.id === t.category_id; })[0] || {}).slug; else route();
      });
      acts.appendChild(ed); acts.appendChild(del);
    }
    bd.appendChild(acts); card.appendChild(bd);
    return card;
  }
  function modBar(t) {
    var m = el("div", { class: "modbar" }); m.appendChild(el("b", null, "🛡️ 管理："));
    function btn(label, patch) { var b = el("button", { type: "button" }, label); b.addEventListener("click", async function () { var r = await db.rpc("forum_moderate", Object.assign({ p_thread: t.id, p_pinned: null, p_locked: null, p_deleted: null, p_category: null }, patch)); if (r.error) return alert(PSRP.errText(r.error)); cats = []; route(); }); m.appendChild(b); }
    btn(t.pinned ? "取消置頂" : "置頂", { p_pinned: !t.pinned });
    btn(t.locked ? "解除鎖定" : "鎖定", { p_locked: !t.locked });
    btn(t.deleted ? "還原主題" : "刪除主題", { p_deleted: !t.deleted });
    var mv = el("select", { "aria-label": "移動到版面" }); mv.appendChild(el("option", { value: "" }, "移動到…"));
    cats.forEach(function (c) { if (c.id !== t.category_id) mv.appendChild(el("option", { value: String(c.id) }, c.title)); });
    mv.addEventListener("change", async function () { if (!mv.value) return; var r = await db.rpc("forum_moderate", { p_thread: t.id, p_pinned: null, p_locked: null, p_deleted: null, p_category: Number(mv.value) }); if (r.error) return alert(PSRP.errText(r.error)); cats = []; route(); });
    m.appendChild(mv);
    return m;
  }

  /* ---------- 發文編輯框 ---------- */
  function editorBox(o) {
    var box = el("form", { class: "editor", novalidate: "" }), title = null;
    if (o.title) { title = el("input", { type: "text", maxlength: "120", placeholder: "主題標題（2～120 字）", "aria-label": "標題" }); box.appendChild(title); }
    var tb = el("div", { class: "tb" });
    var ta = el("textarea", { placeholder: "輸入內容…可以使用 **粗體**、> 引用、- 條列，貼上網址會自動變成連結。", "aria-label": "內容", maxlength: "20000" });
    if (o.body) ta.value = o.body;
    [["粗體", "**", "**"], ["斜體", "*", "*"], ["引用", "> ", ""], ["條列", "- ", ""], ["連結", "[文字](", ")"], ["圖片", "![](", ")"], ["程式碼", "```\n", "\n```"]].forEach(function (x) {
      var b = el("button", { type: "button" }, x[0]);
      b.addEventListener("click", function () { var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value; ta.value = v.slice(0, s) + x[1] + v.slice(s, e) + x[2] + v.slice(e); ta.focus(); ta.selectionStart = ta.selectionEnd = s + x[1].length + (e - s); });
      tb.appendChild(b);
    });
    box.appendChild(tb); box.appendChild(ta);
    var pv = el("div", { class: "content pv", hidden: "" }); box.appendChild(pv);
    var row = el("div", { class: "row" }), msg = el("span", { class: "form-msg", role: "status" });
    var right = el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" });
    var pb = el("button", { type: "button", class: "btn-sec" }, "預覽");
    pb.addEventListener("click", function () { pv.hidden = !pv.hidden; pv.innerHTML = md(ta.value) || '<span class="note">（沒有內容）</span>'; pb.textContent = pv.hidden ? "預覽" : "關閉預覽"; });
    right.appendChild(pb);
    if (o.cancel) { var cb = el("button", { type: "button", class: "btn-sec" }, "取消"); cb.addEventListener("click", o.cancel); right.appendChild(cb); }
    var sb = el("button", { type: "submit", class: "btn-primary" }, o.submit); right.appendChild(sb);
    row.appendChild(msg); row.appendChild(right); box.appendChild(row);
    box.addEventListener("submit", async function (e) {
      e.preventDefault(); msg.className = "form-msg";
      var v = { title: title ? title.value.trim() : "", body: ta.value.trim() };
      if (title && v.title.length < 2) { msg.className = "form-msg err"; msg.textContent = "請輸入標題。"; title.focus(); return; }
      if (!v.body) { msg.className = "form-msg err"; msg.textContent = "請輸入內容。"; ta.focus(); return; }
      sb.disabled = true;
      try { await o.onSubmit(v); } catch (err) { msg.className = "form-msg err"; msg.textContent = PSRP.errText(err); }
      sb.disabled = false;
    });
    return box;
  }
  async function showNew(slug) {
    var c = await catBySlug(slug);
    if (!c) return errBox("找不到這個版面。");
    view.innerHTML = "";
    view.appendChild(crumbs([["論壇", "#"], [c.title, "#c/" + c.slug], ["發表新主題"]]));
    if (!me) { view.appendChild(loginHint("請先登入才能發文。")); return; }
    if (!canPost(c)) { view.appendChild(el("div", { class: "notice warn" }, "你沒有在這個版面發文的權限。")); return; }
    view.appendChild(el("div", { class: "bar" })).appendChild(el("h2", null, "在「" + c.title + "」發表新主題"));
    view.appendChild(editorBox({ title: true, submit: "發表主題", onSubmit: async function (v) {
      var r = await db.rpc("forum_new_thread", { p_category: c.id, p_title: v.title, p_body: v.body });
      if (r.error) throw r.error; cats = []; location.hash = "#t/" + r.data;
    } }));
    view.appendChild(el("p", { class: "side-note" }, "請遵守伺服器規則：禁止人身攻擊、洗版、廣告與分享他人個資。違規文章會由管理團隊刪除。"));
  }

  /* ---------- 路由 ---------- */
  async function route() {
    var h = location.hash.replace(/^#/, ""), m;
    window.scrollTo(0, 0);
    if ((m = h.match(/^c\/([\w-]+)(?:\/(\d+))?$/))) return showCategory(m[1], Number(m[2] || 1));
    if ((m = h.match(/^t\/(\d+)(?:\/(\d+|last|p\d+))?$/))) {
      var pg = 1, jump = null;
      if (m[2] === "last") pg = -1; else if (m[2] && m[2][0] === "p") jump = m[2]; else if (m[2]) pg = Number(m[2]);
      if (jump) {
        var pid = Number(jump.slice(1)), cnt = await db.from("forum_posts").select("id", { count: "exact", head: true }).eq("thread_id", m[1]).lt("id", pid);
        pg = Math.floor((cnt.count || 0) / PPP) + 1;
      }
      await showThread(Number(m[1]), pg);
      var target = jump ? document.getElementById(jump) : (m[2] === "last" ? view.querySelector(".post:last-of-type") : null);
      if (target) target.scrollIntoView({ block: "start" });
      return;
    }
    if ((m = h.match(/^new\/([\w-]+)$/))) return showNew(m[1]);
    return showIndex();
  }
  window.addEventListener("hashchange", route);
  async function start() {
    PSRP.mountAccountChip(document.getElementById("account"));
    if (!db) return errBox("論壇暫時無法使用。");
    me = await PSRP.profile();
    staff = !!me && (PSRP.hasRole(me, "admin") || PSRP.hasRole(me, "support"));
    route();
  }
  start();
})();
</script>
